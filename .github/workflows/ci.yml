# What a green tick here is meant to mean: the same thing a local run means.
#
# The one way that quietly stops being true is Chromium. Eight test files and
# 78 of core's tests gate themselves on a real browser and skip when there
# isn't one, so a broken install leaves the suite passing and proving a sixth
# less. The `test` job launches a browser before running anything, so that
# failure is loud instead.
name: CI

on:
  push:
    branches: [main]
    # A release is a push of a tag, and it runs everything below before it
    # publishes anything: `image` waits on `check` and `test`.
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A superseded run proves nothing about the commit that replaced it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here reads or writes anything else. Publishing, when it lands, asks
# for `packages: write` in its own job rather than widening this.
permissions:
  contents: read

jobs:
  check:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

      # AGENTS.md requires these two to move together. Nothing else enforces
      # it, and a mismatch surfaces only as a browser that will not launch
      # inside the image, which is a long way from the line that caused it.
      - name: Dockerfile Playwright pin matches packages/core
        run: |
          dep=$(node -p "require('./packages/core/package.json').dependencies.playwright")
          img=$(sed -n 's|.*mcr\.microsoft\.com/playwright:v\([0-9.]*\)-.*|\1|p' Dockerfile)
          echo "Dockerfile image: v${img:-<none found>} | packages/core dependency: $dep"
          if [ -z "$img" ]; then
            echo "::error file=Dockerfile::no mcr.microsoft.com/playwright:v<version> tag found"
            exit 1
          fi
          if [ "$img" != "$dep" ]; then
            echo "::error file=Dockerfile::Playwright image v$img does not match packages/core playwright $dep; update both together"
            exit 1
          fi

      # Otherwise an image tagged 0.2.0 can be built from a tree that says
      # 0.1.0, and nothing downstream would ever say so.
      - name: Release tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag: $tag | package.json: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

  test:
    name: Tests (real Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Keyed on the Playwright version rather than the lockfile: the browser
      # build is what the version selects, and nothing else in the lockfile
      # changes it.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/core/package.json').dependencies.playwright")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium

      # The gate the suite itself uses, run once where it can fail the job:
      # a persistent context on the `chromium` channel, which is what
      # browser/stealth.ts asks for and the only thing worth proving here.
      - name: Preflight — a browser really launches
        run: |
          node --input-type=module -e '
          import { chromium } from "playwright";
          import { mkdtempSync, rmSync } from "node:fs";
          import { tmpdir } from "node:os";
          import path from "node:path";
          const dir = mkdtempSync(path.join(tmpdir(), "ci-preflight-"));
          try {
            const context = await chromium.launchPersistentContext(dir, { channel: "chromium", headless: true });
            await context.close();
            console.log("chromium launches: browser-backed tests will run, not skip");
          } finally {
            rmSync(dir, { recursive: true, force: true });
          }'

      - run: npm test

  # One build per architecture, on a runner of that architecture. They run at
  # the same time on separate machines, so arm64 costs a second runner rather
  # than a second build's worth of waiting — and emulating it through QEMU on
  # one runner would cost roughly triple. Each build pushes an untagged blob
  # named only by its digest; `manifest` is what gives them names.
  image:
    name: Image (${{ matrix.platform }})
    needs: [check, test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # `linux/amd64` cannot name an artifact; `linux-amd64` can.
      - name: Name this leg
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only here; the tags are decided once, in `manifest`. These are
      # what let a running container say which commit it came from, and what
      # links the GHCR package back to this repository.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # A pull request proves the Dockerfile still builds and publishes
          # nothing: there is no digest to push and no tag to move.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Hand the digest to the manifest job
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tags live here, applied once to a manifest list covering both builds,
  # so `latest` can never mean amd64 today and arm64 tomorrow.
  #
  #   push to main   main, sha-<commit>
  #   tag v0.1.0     0.1.0, 0.1, latest, sha-<commit>
  #
  # `latest` is the newest release, never the tip of main: `docker run
  # ghcr.io/pfrybar/searchicus` with no tag should be the version that was
  # meant to be shipped. `sha-<commit>` is the only tag that never moves, so
  # it is the one to roll back to.
  manifest:
    name: Tag and publish
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Show what was published
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
